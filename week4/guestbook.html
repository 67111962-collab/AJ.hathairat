<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - GEN Y2K MUSIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-y2k sticky-top">
        <div class="container">
            <a class="navbar-brand y2k-text" href="index.html">💿 Y2K PLAYER</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation" title="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="playlist.html">My Playlist</a></li>
                    <li class="nav-item"><a class="nav-link active" href="guestbook.html">Guestbook</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-y2k p-4">
                    <h2 class="text-center mb-4">SIGN MY GUESTBOOK 📝</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-info">นามแฝง (Nickname):</label>
                            <input type="text" class="form-control bg-dark text-white border-info" placeholder="เช่น เด็กหงส์, วัยรุ่นhi5">
                        </div>
                        <div class="mb-3">
                            <label for="favorite-genre" class="form-label text-info">เพลงโปรดของคุณ:</label>
                            <select id="favorite-genre" class="form-select bg-dark text-white border-info" aria-label="เพลงโปรดของคุณ">
                                <option value="">เลือกแนวเพลง</option>
                                <option value="T-Pop">T-Pop (กามิกาเซ่, อาร์เอส)</option>
                                <option value="Inter">Inter (Britney, Backstreet Boys)</option>
                                <option value="J-Pop">J-Pop / J-Rock</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-info">ข้อความถึง Webmaster:</label>
                            <textarea class="form-control bg-dark text-white border-info" rows="4" placeholder="ฝากข้อความไว้ตรงนี้เลย..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-y2k w-100">SUBMIT</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
