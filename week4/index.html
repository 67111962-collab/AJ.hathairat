<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN Y2K MUSIC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            color: #111;
            font-weight: 700;
            padding: 10px 0;
            border-top: 2px solid rgba(255,255,255,0.25);
            border-bottom: 2px solid rgba(255,255,255,0.25);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .marquee-track {
            display: inline-block;
            min-width: 100%;
            padding-left: 100%;
            animation: marquee-scroll 18s linear infinite;
        }

        .hero-image {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 5px solid #ff00ff;
            box-shadow: 0 0 20px #00ffff;
        }

        @keyframes marquee-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-y2k sticky-top">
        <div class="container">
            <a class="navbar-brand y2k-text" href="index.html">💿 Y2K PLAYER</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="playlist.html">My Playlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="guestbook.html">Guestbook</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ตัวหนังสือวิ่ง (Marquee) ยอดฮิตยุค 2000s -->
    <div class="marquee-container">
        <marquee>Welcome to GEN Y2K Music Zone! 🎵 Now Playing: D2B, Tata Young, Britney Spears, NSYNC... 🎧</marquee>
    </div>

    <!-- Hero Section -->
    <div class="container text-center mt-5">
        <h1 class="display-4 mb-4">BACK TO Y2K VIBES</h1>
        <p class="lead mb-4">ย้อนเวลาสู่ยุค 2000s ไปกับเสียงเพลงที่คุณคิดถึง</p>
        <img src="https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?q=80&w=600&auto=format&fit=crop" class="hero-image img-fluid rounded-circle mb-4" alt="Retro CD">
        <br>
        <a href="playlist.html" class="btn btn-y2k btn-lg px-5">ENTER PLAYLIST ></a>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
