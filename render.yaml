# Render Blueprint for PawSpot (https://render.com/docs/blueprint-spec)
# The app lives in pawspot-project/. Database: Neon PostgreSQL (set DATABASE_URL in the dashboard).
services:
  - type: web
    name: pawspot
    runtime: node
    plan: free
    region: singapore
    rootDir: pawspot-project
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Fill these in on the Render dashboard (never commit them):
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: PUBLIC_URL            # e.g. https://pawspot.onrender.com
        sync: false
      - key: ADMIN_EMAILS          # Google-verified email(s) that become admin
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
